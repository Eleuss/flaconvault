# Dependency update PRs (weekly). Minor and patch updates are grouped per ecosystem. Major version bumps are ignored
# here (they need a planned migration: Next/React, Anchor/Solana SDK, Node/Python base images); security advisories
# still open PRs through Dependabot security updates.
# Security updates are additionally enabled in the repository settings (Dependabot alerts + security updates).
version: 2
updates:
  # npm workspaces: root, packages/proof, packages/vision, apps/web (one lockfile at the root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Irys sidecar of the verifier (own lockfile)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/verify/irys
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      irys-minor-and-patch:
        update-types: [minor, patch]

  # Verifier (uv.lock)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /apps/verify
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Anchor programs (Cargo workspace)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Base images of Dockerfile.verify
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Actions used in .github/workflows
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]   # base images: patches only

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
