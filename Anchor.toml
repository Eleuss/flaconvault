[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
flacon = "7dCr825ibTyE6Y5oPHP2RCmUi5qFPCaKdZmE9TYeAcWL"
escrow = "9vabByStbAqKH6sM6fuf8HhfGZbV3993Ncp3uZScexKL"

[programs.devnet]
flacon = "7dCr825ibTyE6Y5oPHP2RCmUi5qFPCaKdZmE9TYeAcWL"
escrow = "9vabByStbAqKH6sM6fuf8HhfGZbV3993Ncp3uZScexKL"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# NODE_OPTIONS: Node >= 23 would otherwise import the .ts test natively as ESM and bypass ts-node.
test = "NODE_OPTIONS=--no-experimental-strip-types npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

# Local validator: clone Metaplex Core from devnet so /certify can mint real Core assets offline (needs network at start).
[test.validator]
url = "https://api.devnet.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
