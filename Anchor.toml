[toolchain]
# Pinned so `anchor build --verifiable` reproduces the deployed binaries (see programs/README.md).
anchor_version = "1.2.0"
solana_version = "4.1.2"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
flacon = "7dCr825ibTyE6Y5oPHP2RCmUi5qFPCaKdZmE9TYeAcWL"
escrow = "9vabByStbAqKH6sM6fuf8HhfGZbV3993Ncp3uZScexKL"
market_escrow = "CeyUTXX5CbgUNPM1msfnp6UfLdNh8PGLm8DpvdYJsEXW"

[programs.devnet]
flacon = "7dCr825ibTyE6Y5oPHP2RCmUi5qFPCaKdZmE9TYeAcWL"
escrow = "9vabByStbAqKH6sM6fuf8HhfGZbV3993Ncp3uZScexKL"
market_escrow = "CeyUTXX5CbgUNPM1msfnp6UfLdNh8PGLm8DpvdYJsEXW"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# NODE_OPTIONS: Node >= 23 would otherwise import the .ts test natively as ESM and bypass ts-node.
test = "NODE_OPTIONS=--no-experimental-strip-types npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test]
# Deploy the workspace programs upgradeable with the provider wallet as upgrade authority (as on devnet):
# init_registry / init_config only accept the upgrade authority recorded in the ProgramData account.
upgradeable = true

# Local validator: clone Metaplex Core from devnet so /certify can mint real Core assets offline (needs network at start).
# mint_passport only accepts Core assets, so the tests need it too.
[test.validator]
url = "https://api.devnet.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"

# market_escrow: TEST ONLY mints and aged orders (scripts/market-escrow-fixtures.ts). The validator cannot move its
# clock, so the branches that open days after a step run on orders that reached the step on 2026-01-01.
[[test.validator.account_dir]]
directory = "tests/fixtures/market-escrow"
