[project]
name = "flaconvault-verify"
version = "0.1.0"
description = "FlaconVault verification server: NTAG 424 DNA SUN check, nonce, Ed25519 ScanProof signature, passport indexer, tag simulator."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pynacl>=1.5",
  "pycryptodome>=3.20",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "solders>=0.29.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["fv", "libsdm", "config.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
