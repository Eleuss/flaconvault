[package]
name = "escrow"
version = "0.1.0"
description = "FlaconVault — USDC escrow with scan-verified handover (briefing §11)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "flacon/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token"] }
# flacon account types (Passport / Seal / ScanProof) with their owner + discriminator checks
flacon = { path = "../flacon", features = ["no-entrypoint"] }

[dev-dependencies]
# tests/time_travel.rs: the window branches under a Clock override (needs target/deploy/escrow.so from `anchor build`)
litesvm = "0.10"
solana-account = "3"
solana-keypair = "4"
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
